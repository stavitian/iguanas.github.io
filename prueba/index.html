<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de GitHub Pages</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
    }

    main {
      width: min(36rem, calc(100% - 3rem));
      padding: 2.5rem;
      text-align: center;
      border: 1px solid #334155;
      border-radius: 1rem;
      background: #1e293b;
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 30%);
    }

    h1 {
      margin-top: 0;
      color: #86efac;
    }

    code {
      color: #fde68a;
    }
  </style>
</head>
<body>
  <main>
    <h1>¡GitHub Pages funciona! 🎉</h1>
    <p>Esta página se sirve desde <code>prueba/index.html</code>.</p>
  </main>
</body>
</html>
